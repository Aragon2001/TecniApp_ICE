name: Release Android (build, firma y publica update.json)

# Se dispara al empujar un tag con forma vX.Y.Z (ej. v1.2.3).
# Flujo: calcula versionCode/versionName desde el tag → compila y firma el APK
# de release con el keystore guardado en Secrets → crea un GitHub Release con el
# APK como asset → genera/actualiza updates/update.json (lo que lee
# GithubUpdateChecker.kt en la app) y lo commitea a la rama por defecto.
#
# Requisitos únicos de configuración (una sola vez, en Settings del repo):
# 1. Settings → Actions → General → "Workflow permissions" = "Read and write permissions".
# 2. Settings → Secrets and variables → Actions → agregar:
#    - KEYSTORE_BASE64   (el .jks de release codificado en base64)
#    - KEYSTORE_PASSWORD
#    - KEY_ALIAS
#    - KEY_PASSWORD
#    Ver CREDENCIALES_KEYSTORE.txt (entregado fuera de git) para estos valores.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Calcular versionCode / versionName desde el tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Tag=$GITHUB_REF_NAME  versionName=$TAG  versionCode=$VERSION_CODE"

      - name: Decodificar keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y firmar APK de release
        env:
          KEYSTORE_PATH: ${{ format('{0}/release.jks', runner.temp) }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.version_code }} \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            --no-daemon

      - name: Ubicar y renombrar el APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "No se encontró ningún APK en app/build/outputs/apk/release"; exit 1
          fi
          DEST="app/build/outputs/apk/release/tecniapp-ice-${{ steps.version.outputs.version_name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$DEST")" >> "$GITHUB_OUTPUT"

      - name: Calcular SHA-256 del APK
        id: sha
        run: |
          SHA=$(sha256sum "${{ steps.apk.outputs.path }}" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Verificar firma del APK (informativo)
        run: |
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "${{ steps.apk.outputs.path }}" || true

      - name: Crear GitHub Release y subir el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TecniApp ICE ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      - name: Generar updates/update.json
        run: |
          mkdir -p updates
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          FILENAME="${{ steps.apk.outputs.filename }}"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"
          cat > updates/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "${APK_URL}",
            "sha256": "${{ steps.sha.outputs.sha256 }}",
            "notes": "Actualización a la versión ${{ steps.version.outputs.version_name }}."
          }
          EOF
          cat updates/update.json

      - name: Commitear update.json en la rama por defecto
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          mkdir -p updates
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          FILENAME="${{ steps.apk.outputs.filename }}"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"
          cat > updates/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "${APK_URL}",
            "sha256": "${{ steps.sha.outputs.sha256 }}",
            "notes": "Actualización a la versión ${{ steps.version.outputs.version_name }}."
          }
          EOF
          git add updates/update.json
          git commit -m "chore(update): publicar update.json para ${{ steps.version.outputs.version_name }} [skip ci]" || echo "Sin cambios que commitear"
          git push origin "$DEFAULT_BRANCH"
